name: Verify Spider Platform

on:
  push:
    branches:
      - spider-platform-test
  pull_request:
    branches:
      - spider-platform-test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run production build
        run: npm run build
