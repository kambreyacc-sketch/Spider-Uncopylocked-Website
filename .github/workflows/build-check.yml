name: Build check
on:
  push:
    branches: [main, build/glossy-platform-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://adept-hare-258.convex.cloud
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint (when configured)
        run: |
          if npm ls eslint --depth=0 >/dev/null 2>&1; then
            npm run lint
          else
            echo "::notice::ESLint is not installed in this repository; lint is skipped. TypeScript and production build checks still run."
          fi
      - name: Build Next.js
        run: npm run build
